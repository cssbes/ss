services:
  - type: web
    name: auth-app
    env: docker
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auth-app-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://auth-app.onrender.com
      - key: AUTH_URL
        value: https://auth-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://auth-app.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Auth App
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM
        value: noreply@authapp.com
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: auth-app-db
    plan: free
    region: oregon
    databaseName: auth_app
