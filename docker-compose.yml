version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/auth_app?schema=public"
      AUTH_SECRET: "super-secret-key-change-in-production-abc123"
      AUTH_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "super-secret-key-change-in-production-abc123"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: "noreply@authapp.com"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "Auth App"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx tsx prisma/seed.ts &&
      node server.js
      "

volumes:
  postgres_data:
